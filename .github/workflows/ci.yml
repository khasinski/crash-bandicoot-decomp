name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoring dependencies
        run: python -m pip install pyelftools
      - name: Run retail-free checks
        run: make test-source PY=python
